<!doctype html>
<!-- App icon, 1024 × 1024: the condensed "A", white on black.
     ?shape=circle for the favicons (transparent corners), otherwise a full-bleed square (apple-touch, manifest). -->
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  /* Anton's "A" is 550 px tall at 640 px and starts 41 px below its line box: centred at (1024 - 550) / 2 - 41 = 196 */
  .icon { position: relative; width: 1024px; height: 1024px; background: #000; color: #fff; font: 400 640px/1 Anton, sans-serif; }
  .circle { border-radius: 50%; }
  .a { position: absolute; top: 196px; left: 0; right: 0; text-align: center; }
</style>
<div class="icon"><span class="a">A</span></div>
<script>if (new URLSearchParams(location.search).get('shape') === 'circle') document.querySelector('.icon').classList.add('circle')</script>
