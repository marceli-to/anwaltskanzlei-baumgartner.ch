<!doctype html>
<!-- Open Graph image, 1200 × 630: the photo panel on the left, the firm on the right, like the site. -->
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  body { width: 1200px; height: 630px; display: grid; grid-template-columns: 450px 1fr; grid-template-rows: 1fr 34px; background: #fff; font-family: "Host Grotesk", sans-serif; color: #000; overflow: hidden; }
  .panel { position: relative; overflow: hidden; }

  .line { position: absolute; left: 56px; top: 262px; width: 158px; height: 4px; background: #000; }
  .sub { position: absolute; left: 56px; top: 285px; font: 700 19px/19px Antonio, sans-serif; letter-spacing: 0.005em; }
  .text { padding: 92px 72px 0 64px; }
  h1 { margin: 0; font-size: 46px; line-height: 1.12; font-weight: 700; }
  p { margin: 36px 0 0; font-size: 24px; line-height: 1.4; max-width: 600px; }
  footer { grid-column: 1 / -1; background: #000; color: #fff; font-size: 16px; display: flex; align-items: center; padding: 0 56px; }
</style>

</div>
